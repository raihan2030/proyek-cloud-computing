services:
  # Web Server (Nginx) - Mengarah ke Public Network
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - public_net
    depends_on:
      - app

  # App Server (PHP-FPM + Laravel) - Berada di Public & Private Network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - public_net
      - private_net

  # Database Server (MySQL) - Terisolasi di Private Network
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private_net

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge

volumes:
  db_data: